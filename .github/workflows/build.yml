name: Windows & Android Build & Artifacts

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build StreloReminder (Windows EXE)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Stamp CI Build Version into UpdateService.cs
        shell: pwsh
        run: |
          $ver = "1.3.${{ github.run_number }}"
          $path = "Services/UpdateService.cs"
          $content = Get-Content $path -Raw -Encoding UTF8
          $content = $content -replace 'CurrentVersion = "[^"]+"', "CurrentVersion = `"$ver`""
          [System.IO.File]::WriteAllText((Resolve-Path $path), $content, (New-Object System.Text.UTF8Encoding($true)))
          Write-Host "Stamped Windows version: $ver"

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build standalone .NET Framework EXE (built-in Windows csc.exe)
        shell: pwsh
        run: |
          $csc = "$env:SystemRoot\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          if (-not (Test-Path $csc)) {
            throw "csc.exe not found at $csc"
          }
          New-Item -ItemType Directory -Force -Path "artifacts/net48-standalone" | Out-Null
          & $csc /nologo /target:winexe /optimize+ /utf8output /codepage:65001 `
            /out:artifacts/net48-standalone/StreloReminder.exe `
            /r:System.dll `
            /r:System.Core.dll `
            /r:System.Drawing.dll `
            /r:System.Windows.Forms.dll `
            /r:System.Runtime.Serialization.dll `
            /r:System.Xml.dll `
            Program.cs `
            Models\ReminderItem.cs `
            Models\CloudSyncConfig.cs `
            Services\StorageService.cs `
            Services\CloudSyncService.cs `
            Services\UpdateService.cs `
            Services\IconGenerator.cs `
            Forms\PopupNotificationForm.cs `
            Forms\CloudSyncForm.cs `
            Forms\MainForm.cs
          if ($LASTEXITCODE -ne 0) {
            throw "csc.exe compilation failed with exit code $LASTEXITCODE"
          }
          Get-Item "artifacts/net48-standalone/StreloReminder.exe" | Format-List Name, Length, LastWriteTime

      - name: Restore & Build .NET 8 WinForms project
        shell: pwsh
        run: |
          dotnet restore StreloReminder.csproj
          dotnet build StreloReminder.csproj -c Release --no-restore

      - name: Publish .NET 8 Single-File Executable (win-x64)
        shell: pwsh
        run: |
          dotnet publish StreloReminder.csproj `
            -c Release `
            -r win-x64 `
            --self-contained false `
            -p:PublishSingleFile=true `
            -p:DebugType=None `
            -p:DebugSymbols=false `
            -o artifacts/net8-win-x64

      - name: Upload Standalone EXE Artifact (.NET Framework 4.8 — works on any Windows 10/11)
        uses: actions/upload-artifact@v4
        with:
          name: StreloReminder-Standalone-Win10-11
          path: artifacts/net48-standalone/StreloReminder.exe
          if-no-files-found: error

      - name: Upload .NET 8 Win-x64 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StreloReminder-Net8-WinX64
          path: artifacts/net8-win-x64/
          if-no-files-found: error

  build-android:
    name: Build StreloReminder (Android APK)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Stamp CI Build Version into Android sources
        run: |
          VER="1.3.${{ github.run_number }}"
          CODE="${{ github.run_number }}"
          sed -i "s/CURRENT_VERSION = \"[^\"]*\"/CURRENT_VERSION = \"$VER\"/g" android/app/src/main/java/com/strelo/reminder/UpdateService.java
          sed -i "s/versionCode [0-9]*/versionCode $CODE/g" android/app/build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"$VER\"/g" android/app/build.gradle
          echo "Stamped Android version: $VER (code $CODE)"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build Android APK
        working-directory: android
        run: |
          gradle assembleRelease --no-daemon
          mkdir -p ../artifacts/android
          cp app/build/outputs/apk/release/app-release.apk ../artifacts/android/StreloReminder-Android.apk
          ls -lh ../artifacts/android/StreloReminder-Android.apk

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StreloReminder-Android-APK
          path: artifacts/android/StreloReminder-Android.apk
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release (Auto-Update Feed)
    needs: [build-windows, build-android]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Windows Standalone EXE Artifact
        uses: actions/download-artifact@v4
        with:
          name: StreloReminder-Standalone-Win10-11
          path: release-assets

      - name: Download Android APK Artifact
        uses: actions/download-artifact@v4
        with:
          name: StreloReminder-Android-APK
          path: release-assets

      - name: Create or Update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v1.3.${{ github.run_number }}"
          TITLE="StreloReminder $TAG (Windows EXE + Android APK)"
          NOTES="Автоматическая сборка **StreloReminder $TAG** для Windows и Android.

          ### Файлы для скачивания и автообновления:
          - **StreloReminder.exe** — автономная версия для Windows 10/11 (не требует установки .NET).
          - **StreloReminder-Android.apk** — установочный пакет для Android (7.0+).

          Клиенты Windows и Android автоматически проверяют наличие этого релиза через GitHub API и уведомляют пользователя о выходе новой версии."

          ls -lh release-assets/
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release-assets/StreloReminder.exe release-assets/StreloReminder-Android.apk --clobber
          else
            gh release create "$TAG" release-assets/StreloReminder.exe release-assets/StreloReminder-Android.apk \
              --title "$TITLE" \
              --notes "$NOTES" \
              --target "${{ github.sha }}"
          fi
